# Builds the F1 Party app for every platform. A tag like v0.2.0 also publishes a GitHub release with the files.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  WAILS_VERSION: v2.17.1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            flags: -nsis
            out: F1Party-windows.exe
          - os: ubuntu-24.04
            platform: linux/amd64
            tags: webkit2_41
            out: F1Party-linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: NSIS (Windows installer)
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
      - name: Version from the tag
        # A tag v1.2.3 makes the app report 1.2.3, so the update check always sees the new release
        # (main.go's version is only the fallback for builds without a tag).
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "LDFLAGS=-X main.version=$v" >> "$GITHUB_ENV"
          sed -i.bak "s/\"productVersion\": \"[^\"]*\"/\"productVersion\": \"$v\"/" wails.json && rm -f wails.json.bak
      - name: Build
        run: wails build -clean -trimpath -platform ${{ matrix.platform }} ${{ matrix.flags }} ${{ matrix.tags && format('-tags {0}', matrix.tags) || '' }} ${LDFLAGS:+-ldflags "$LDFLAGS"}
      - name: Package
        run: |
          mkdir -p ../dist
          case "${{ runner.os }}" in
            Windows) cp build/bin/F1Party.exe "../dist/${{ matrix.out }}"
                     cp build/bin/*installer*.exe ../dist/F1Party-windows-setup.exe ;;
            Linux)   cp build/bin/F1Party "../dist/${{ matrix.out }}" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums (the Windows app checks its self-update against these)
        run: cd dist && sha256sum * > checksums.txt && cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
