# Builds the F1 Party app for every platform and publishes a GitHub release.
# Every push to master releases automatically: the newest vX.Y.Z tag plus one minor (1.5.0 -> 1.6.0).
# Pushing a tag like v2.0.0 by hand still works and uses that exact version.
# Pushes that only touch docs/, relay/ or Markdown files do not release.
name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore: ["docs/**", "relay/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  WAILS_VERSION: v2.17.1

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
            last="${last#v}"; last="${last:-0.0.0}"
            IFS=. read -r major minor _ <<< "$last"
            v="$major.$((minor + 1)).0"
          fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            flags: -nsis
            out: F1Party-windows.exe
          - os: ubuntu-24.04
            platform: linux/amd64
            tags: webkit2_41
            out: F1Party-linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: NSIS (Windows installer)
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
      - name: Version
        # The release version is baked into the app, so the update check always sees the new release
        # (main.go's version is only the fallback for local builds).
        run: |
          v="${{ needs.version.outputs.v }}"
          echo "LDFLAGS=-X main.version=$v" >> "$GITHUB_ENV"
          sed -i.bak "s/\"productVersion\": \"[^\"]*\"/\"productVersion\": \"$v\"/" wails.json && rm -f wails.json.bak
      - name: Build
        run: wails build -clean -trimpath -platform ${{ matrix.platform }} ${{ matrix.flags }} ${{ matrix.tags && format('-tags {0}', matrix.tags) || '' }} ${LDFLAGS:+-ldflags "$LDFLAGS"}
      - name: Package
        run: |
          mkdir -p ../dist
          case "${{ runner.os }}" in
            Windows) cp build/bin/F1Party.exe "../dist/${{ matrix.out }}"
                     cp build/bin/*installer*.exe ../dist/F1Party-windows-setup.exe ;;
            Linux)   cp build/bin/F1Party "../dist/${{ matrix.out }}" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/*

  release:
    if: github.event_name != 'workflow_dispatch'
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums (the Windows app checks its self-update against these)
        run: cd dist && sha256sum * > checksums.txt && cat checksums.txt
      - uses: actions/checkout@v5
        with:
          sparse-checkout: app/whatsnew.go
          sparse-checkout-cone-mode: false
          path: src
      - name: Patch notes (this version's "What's new" from app/whatsnew.go, like Clipper's CHANGELOG.md)
        env:
          V: ${{ needs.version.outputs.v }}
        run: |
          python3 - <<'PY' > notes.md
          import os, re, json
          v = os.environ["V"]
          src = open("src/app/whatsnew.go", encoding="utf-8").read()
          items = [json.loads(t) for ver, t in re.findall(r'\{"([0-9.]+)",\s*("(?:[^"\\]|\\.)*")', src) if ver == v]
          if items:
              print("## What's new\n")
              print("\n".join("- " + t for t in items))
          PY
          [ -s notes.md ] || echo "::warning::app/whatsnew.go has no entry for $V: release notes are only the PR list"
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          tag_name: v${{ needs.version.outputs.v }}
          name: F1 Party ${{ needs.version.outputs.v }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: dist/*
