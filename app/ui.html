<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Party</title>
<style>
	:root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --text:#e8eaf0; --dim:#9aa1b1; --red:#e10600; --ok:#2fbf71; --warn:#e8a33d; }
	* { box-sizing: border-box; }
	body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; display:flex; justify-content:center; padding:32px 16px; }
	main { width:100%; max-width:460px; }
	h1 { font-size:22px; margin:0 0 4px; display:flex; align-items:center; gap:10px; }
	h1 .flag { width:10px; height:22px; background:var(--red); border-radius:2px; }
	.sub { color:var(--dim); margin:0 0 24px; }
	.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:14px; }
	label { display:block; font-size:13px; color:var(--dim); margin-bottom:6px; }
	input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:#0c0e12; color:var(--text); font:inherit; }
	select { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:#0c0e12; color:var(--text); font:inherit; }
	.mvline { display:flex; align-items:center; gap:10px; justify-content:space-between; }
	.mvline button { flex:none; }
	a { color:#ff6b6b; }
	input.code { text-transform:uppercase; letter-spacing:4px; font-weight:600; }
	button { padding:10px 14px; border-radius:8px; border:0; font:inherit; font-weight:600; cursor:pointer; background:#2a2f3a; color:var(--text); }
	button.primary { background:var(--red); color:#fff; }
	button:disabled { opacity:.5; cursor:default; }
	.row { display:flex; gap:10px; margin-top:12px; }
	.row > * { flex:1; }
	.or { text-align:center; color:var(--dim); font-size:13px; margin:14px 0; }
	.bigcode { font-size:36px; font-weight:700; letter-spacing:8px; text-align:center; margin:4px 0 2px; user-select:all; }
	.hint { color:var(--dim); font-size:13px; text-align:center; }
	.status { display:flex; align-items:center; gap:10px; }
	.dot { width:10px; height:10px; border-radius:50%; background:var(--warn); flex:none; }
	.dot.ok { background:var(--ok); }
	.dot.bad { background:var(--red); }
	ul { list-style:none; margin:8px 0 0; padding:0; }
	li { display:flex; justify-content:space-between; padding:7px 0; border-top:1px solid var(--line); font-size:14px; }
	li span:last-child { color:var(--dim); }
	.meta { color:var(--dim); font-size:13px; margin-top:8px; }
	.error { color:#ff6b6b; font-size:13px; margin-top:8px; min-height:1em; }
	.hidden { display:none; }
	footer { color:var(--dim); font-size:12px; text-align:center; margin-top:18px; }
</style>
</head>
<body>
<main>
	<h1><span class="flag"></span>F1 Party</h1>
	<p class="sub">Watch MultiViewer in sync with friends.</p>

	<section id="start">
		<div class="card">
			<label for="name">Your name</label>
			<input id="name" maxlength="24" placeholder="Name">
			<div class="row"><button class="primary" id="host">Host a party</button></div>
			<div class="or">or join one</div>
			<label for="code">Party code</label>
			<input id="code" class="code" maxlength="8" placeholder="ABCDE">
			<div class="row"><button id="join">Join</button></div>
			<div class="error" id="err"></div>
		</div>
	</section>

	<section id="party" class="hidden">
		<div class="card">
			<div class="hint" id="roleline"></div>
			<div class="bigcode" id="bigcode"></div>
			<div class="hint" id="codehint"></div>
			<div class="row"><button id="copycode">Copy code</button></div>
		</div>
		<div class="card">
			<div class="status"><span class="dot" id="dot"></span><span id="status"></span></div>
			<div class="meta" id="feed"></div>
			<div class="row"><button id="sync">Sync now</button></div>
			<div class="error" id="syncerr"></div>
		</div>
		<div class="card">
			<label>In this party</label>
			<ul id="members"></ul>
		</div>
	</section>

	<div class="card" id="mvcard">
		<div class="mvline"><span class="status"><span class="dot" id="mvdot"></span><span id="mvstate">MultiViewer</span></span>
			<button id="mvstart" class="hidden">Open MultiViewer</button><button id="mvrestart" class="hidden">Restart for setups</button></div>
		<div class="meta" id="mvhint"></div>
		<div id="setupbox">
			<label for="setup" style="margin-top:14px">Your MultiViewer setup</label>
			<select id="setup"></select>
			<div class="meta" id="setuphint"></div>
			<div class="meta" id="pluginhint"></div>
			<div class="row"><button id="setupopen">Open setup now</button></div>
		</div>
		<div class="error" id="mverr"></div>
	</div>
	<div class="row hidden" id="partybtns"><button id="leave">Leave party</button><button id="quit">Quit F1 Party</button></div>
	<footer id="ver"></footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
async function post(path, body) {
	const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
	if (!r.ok) throw new Error((await r.text()).trim());
	return r.json();
}
const fmtTime = (s) => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60;
	return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
const fmtDrift = (d) => d == null ? "" : (Math.abs(d) < 0.05 ? "±0.0 s" : (d > 0 ? "+" : "−") + Math.abs(d).toFixed(1) + " s");

$("host").onclick = async () => { $("err").textContent = ""; try { await post("/api/host", { name: $("name").value }); refresh(); } catch (e) { $("err").textContent = e.message; } };
$("join").onclick = async () => { $("err").textContent = ""; try { await post("/api/join", { name: $("name").value, code: $("code").value }); refresh(); } catch (e) { $("err").textContent = e.message; } };
$("code").addEventListener("keydown", (e) => { if (e.key === "Enter") $("join").click(); });
$("leave").onclick = async () => { await post("/api/leave"); refresh(); };
$("quit").onclick = async () => { await post("/api/quit"); clearInterval(timer); };
$("copycode").onclick = async () => {
	try { await post("/api/copycode"); $("copycode").textContent = "Copied!"; }
	catch (e) { $("copycode").textContent = "Couldn't copy"; }
	setTimeout(() => { $("copycode").textContent = "Copy code"; }, 1500);
};
$("sync").onclick = async () => { $("syncerr").textContent = ""; try { await post("/api/sync"); } catch (e) { $("syncerr").textContent = e.message; } };

// ---- MultiViewer: start it, setup support, choose and open a setup
const mvAct = (btn, path, body) => async () => {
	$("mverr").textContent = ""; btn.disabled = true;
	try { await post(path, body && body()); } catch (e) { $("mverr").textContent = e.message; }
	btn.disabled = false; refreshMV();
};
$("mvstart").onclick = mvAct($("mvstart"), "/api/mv/start");
$("mvrestart").onclick = async () => {
	if (!confirm("MultiViewer closes and opens again, so F1 Party can open your setups. Continue?")) return;
	await mvAct($("mvrestart"), "/api/mv/restart")();
};
$("setup").onchange = async () => { await post("/api/setup", { name: $("setup").value }); refreshMV(); };
$("setupopen").onclick = mvAct($("setupopen"), "/api/setup/open", () => ({ name: $("setup").value }));

let mode = "idle";
const SD = "@streamdeck";
async function refreshMV() {
	let m; try { m = await (await fetch("/api/mv")).json(); } catch { return; }
	$("mvdot").className = "dot " + (m.running ? "ok" : "bad");
	$("mvstate").textContent = m.running ? "MultiViewer is running" : (m.installed ? "MultiViewer isn't running" : "MultiViewer isn't installed");
	$("mvstart").classList.toggle("hidden", m.running || !m.installed);
	$("mvrestart").classList.toggle("hidden", !m.running || m.setupsReady || !(m.setups || []).length);
	$("mvhint").textContent = !m.installed ? "Get it at multiviewer.app/download and sign in with F1 TV."
		: m.running && !m.setupsReady && (m.setups || []).length ? "To open your setups, F1 Party needs to start MultiViewer itself." : "";
	const sel = $("setup"), names = (m.setups || []).map(s => s.name), pl = m.plugin || {};
	const want = ["", SD, ...names].join("|");
	if (sel.dataset.list !== want) {
		sel.innerHTML = "";
		sel.append(new Option("None: only the world feed", ""));
		sel.append(new Option("Stream Deck: F1 Race Control (Race / Quali)", SD));
		for (const s of m.setups || []) sel.append(new Option(`${s.name} (${s.players} players)`, s.name));
		sel.dataset.list = want;
	}
	if (document.activeElement !== sel) sel.value = [SD, ...names].includes(m.setup) ? m.setup : "";
	const sd = sel.value === SD;
	$("setuphint").textContent = sd
		? "Your Stream Deck plugin opens everything: its own desktop, MultiViewer and Ultimate F1 Viewer in place, the Race or Quali setup and layout."
		: mode === "host" ? "Opens for the session you have open in MultiViewer."
		: "Opens by itself when you join a party, for the host's session.";
	const hint = $("pluginhint"); hint.innerHTML = "";
	if (sd) {
		const link = (text, url) => { const a = document.createElement("a"); a.textContent = text; a.href = "#";
			a.onclick = (e) => { e.preventDefault(); post("/api/openurl", { url }); }; return a; };
		if (!pl.installed) hint.append("The F1 Race Control plugin isn't installed. ", link("Download it", pl.download),
			" (open the file to add it to Stream Deck) or ", link("read more", pl.page), ".");
		else if (!pl.running) hint.append("The plugin is installed but doesn't answer: start Stream Deck, or ", link("update the plugin", pl.download), ".");
		else hint.append("Plugin ready (version " + pl.version + ").");
	}
	$("setupopen").disabled = sd ? !pl.running : (!m.setupsReady || !sel.value);
}
refreshMV();
setInterval(refreshMV, 3000);

let nameFilled = false;
async function refresh() {
	let s;
	try { s = await (await fetch("/api/status")).json(); }
	catch { $("status").textContent = "F1 Party isn't running anymore"; $("dot").className = "dot bad"; return; }
	if (!nameFilled) { $("name").value = s.name || ""; nameFilled = true; }
	$("ver").textContent = "F1 Party " + s.version;
	const inParty = s.mode !== "idle";
	if (mode !== s.mode) { mode = s.mode; refreshMV(); }
	$("start").classList.toggle("hidden", inParty);
	$("party").classList.toggle("hidden", !inParty);
	$("partybtns").classList.toggle("hidden", !inParty);
	$("sync").textContent = s.mode === "guest" ? "Sync to host now" : "Sync onboards now";
	if (!inParty) return;

	$("roleline").textContent = s.mode === "host" ? "You're hosting. Party code:" : "You joined party";
	$("bigcode").textContent = s.code;
	$("codehint").textContent = s.mode === "host" ? "Friends enter this code in their F1 Party app." : "";
	$("status").textContent = s.status || "";
	let cls = "dot";
	if (!s.mvOnline || !s.connected) cls += " bad";
	else if (/in sync|hosting/i.test(s.status || "")) cls += " ok";
	$("dot").className = cls;
	$("feed").textContent = s.feed ? `${s.feed.title === "F1 LIVE" ? "F1 Live" : "International"} · ${s.feed.live ? "LIVE" : fmtTime(s.feed.time)}${s.feed.paused ? " · paused" : ""}${s.mode === "guest" && s.drift != null ? " · " + fmtDrift(s.drift) + " vs host" : ""}` : "";

	const ul = $("members"); ul.innerHTML = "";
	for (const m of (s.members || []).sort((a, b) => (a.role === "host" ? -1 : 0) - (b.role === "host" ? -1 : 0))) {
		const li = document.createElement("li");
		const a = document.createElement("span"); a.textContent = m.name + (m.role === "host" ? " (host)" : "");
		const b = document.createElement("span"); b.textContent = m.role === "host" ? "" : (m.status === "In sync" || m.status === "In sync (live)" ? fmtDrift(m.drift) : (m.status || "…"));
		li.append(a, b); ul.append(li);
	}
}
refresh();
const timer = setInterval(refresh, 500);
</script>
</body>
</html>
